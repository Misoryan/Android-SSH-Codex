name: Platform builds

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.7
  FLUTTER_OHOS_REVISION: 244a0e8abb3085e8675589b13e219af8c41cb7aa
  OHOS_SDK_VERSION: 6.1.1.280

jobs:
  android:
    name: Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache Pub and Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: android-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - name: Generate Android platform
        run: bash tool/prepare_android.sh
      - name: Restore Android signing identity
        id: android-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "$EXPECTED_CERT_SHA256" ]] || missing+=(ANDROID_SIGNING_CERT_SHA256)

          if (( ${#missing[@]} > 0 )); then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A release tag requires: ${missing[*]}"
              exit 1
            fi
            echo "::notice::Stable Android signing is unavailable for this event; using the generated debug identity."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Build app bundle
        run: flutter build appbundle --release
      - name: Verify Android APK signatures
        env:
          SIGNING_CONFIGURED: ${{ steps.android-signing.outputs.configured }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

          for apk in build/app/outputs/flutter-apk/*.apk; do
            report=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$report"
            actual=$(printf '%s\n' "$report" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]')
            test -n "$actual"
            if [[ "$SIGNING_CONFIGURED" == true && "$actual" != "$expected" ]]; then
              echo "::error file=$apk::Signer SHA-256 mismatch: expected $expected, got $actual"
              exit 1
            fi
          done

          aab=$(find build/app/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$aab"
          jarsigner -verify "$aab"
          aab_report=$(keytool -printcert -jarfile "$aab")
          printf '%s\n' "$aab_report"
          aab_actual=$(printf '%s\n' "$aab_report" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')
          test -n "$aab_actual"
          if [[ "$SIGNING_CONFIGURED" == true && "$aab_actual" != "$expected" ]]; then
            echo "::error file=$aab::Signer SHA-256 mismatch: expected $expected, got $aab_actual"
            exit 1
          fi
      - name: Collect Android artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/*.apk dist/android/
          cp build/app/outputs/bundle/release/*.aab dist/android/
          cd dist/android
          sha256sum *.apk *.aab > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/android
          if-no-files-found: error
          retention-days: 14
      - name: Remove Android signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks

  ohos:
    name: OpenHarmony HAP
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          cache: true
      - name: Cache Flutter-OH and Pub
        uses: actions/cache@v6
        with:
          path: |
            ~/flutter-ohos
            ~/.pub-cache
          key: ohos-${{ runner.os }}-${{ env.FLUTTER_OHOS_REVISION }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: ohos-${{ runner.os }}-${{ env.FLUTTER_OHOS_REVISION }}-
      - name: Setup pinned Flutter-OH
        run: |
          if [[ ! -d "$HOME/flutter-ohos/.git" ]]; then
            git clone --filter=blob:none --no-checkout https://gitcode.com/CPF-Flutter/flutter_flutter.git "$HOME/flutter-ohos"
          fi
          git -C "$HOME/flutter-ohos" fetch --depth 1 origin "$FLUTTER_OHOS_REVISION"
          git -C "$HOME/flutter-ohos" checkout --detach "$FLUTTER_OHOS_REVISION"
          echo "$HOME/flutter-ohos/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter-ohos/bin:$PATH"
          flutter --version
      - name: Configure OHPM registries
        run: |
          printf '%s\n' \
            'registry=https://repo.huaweicloud.com/repository/npm/' \
            '@ohos:registry=https://repo.harmonyos.com/npm/' > "$HOME/.npmrc"
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
      - name: Generate OpenHarmony platform
        run: bash tool/prepare_ohos.sh
      - run: flutter pub get
      - name: Install OHPM dependencies
        working-directory: ohos
        run: ohpm install
      - name: Build unsigned HAP
        run: flutter build hap --release --no-codesign --target-platform ohos-arm64
      - name: Collect HAP artifact
        run: |
          mkdir -p dist/ohos
          hap=$(find ohos -type f -name '*.hap' | head -n 1)
          test -n "$hap"
          cp "$hap" dist/ohos/android-ssh-codex-ohos-arm64-unsigned.hap
          cd dist/ohos
          sha256sum *.hap > SHA256SUMS-ohos.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ohos-release
          path: dist/ohos
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ohos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Create combined checksums
        run: |
          find dist -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "Android SSH Codex ${GITHUB_REF_NAME}" \
            dist/*
